<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="破甲&amp;注入">
  <!-- 实心锁：单一黑色剪影，交给宿主按当前文字色渲染。
       侧栏只给 12–16px，锁体成块、钥匙孔留空，缩到 18px 仍能读出锁形；
       黑白两态共用同一个 alpha 形状，不依赖主题色。
       独立文件名 icon-lock.svg：避免宿主沿用旧 icon.svg 的侧栏缓存。 -->
  <title>破甲&amp;注入</title>
  <defs>
    <mask id="purge-lock-cut">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="37.4" r="4.8" fill="#000"/>
      <rect x="29.9" y="40.4" width="4.2" height="8.8" rx="2.1" fill="#000"/>
    </mask>
  </defs>
  <path d="M22 30V22.7C22 14.4 26.6 9 32 9s10 5.4 10 13.7V30"
        fill="none" stroke="#000" stroke-width="7.4" stroke-linecap="round"/>
  <rect x="13.2" y="26.8" width="37.6" height="28.2" rx="8.4" fill="#000" mask="url(#purge-lock-cut)"/>
</svg>
